<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wakefield sim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Tokens mirror client/design.ts. */
  :root { --canvas: #050607; --surface: #0b0d10; --line: #1c2127; --ink: #d9e1e8; --muted: #717d89; --signal: #2df5d0; --caution: #f5c22d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--canvas); color: var(--ink); font: 13px/1.5 "JetBrains Mono", ui-monospace, monospace; }
  body { display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
  header { display: flex; align-items: center; gap: 24px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 13px; letter-spacing: 0.3em; font-weight: 500; }
  header h1 span { color: var(--signal); }
  .meta { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); }
  #status { color: var(--signal); }
  main { display: grid; grid-template-columns: 1fr 340px; min-height: 0; }
  #stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
  #devices { position: absolute; top: 0; left: 0; display: flex; flex-direction: column; gap: 40px; padding: 28px; transform-origin: 0 0; }
  .row { display: flex; align-items: flex-start; gap: 32px; }
  .device { display: flex; flex-direction: column; gap: 10px; }
  .device .label { font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
  .device .label b { color: var(--ink); font-weight: 500; }
  .device .label i { font-style: normal; color: var(--signal); }
  .bezel { border: 1px solid var(--line); padding: 12px; background: var(--surface); }
  .device.active .bezel { border-color: var(--signal); }
  iframe { display: block; border: 0; background: var(--canvas); }
  aside { border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  aside h2 { margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 11px; font-weight: 500; letter-spacing: 0.25em; text-transform: uppercase; color: var(--muted); }
  #log { flex: 1; overflow-y: auto; padding: 8px 0; margin: 0; list-style: none; }
  #log li { padding: 6px 16px; font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 13px; line-height: 1.45; color: var(--muted); }
  #log li b { display: block; font-family: "JetBrains Mono", monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink); }
  #log li.table b { color: var(--signal); }
  #log li.note { color: var(--caution); }
  #log time { float: right; font-family: "JetBrains Mono", monospace; font-size: 10px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>WAKEFIELD<span>_</span> SIM</h1>
  <span class="meta" id="mode"></span>
  <span class="meta" id="status">Starting</span>
</header>
<main>
  <section id="stage"><div id="devices"><div class="row" id="row-big"></div><div class="row" id="row-phones"></div></div></section>
  <aside><h2>What happened</h2><ol id="log"></ol></aside>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const dev = params.get("dev") || "http://127.0.0.1:3166";
  const list = (key, fallback) => (params.get(key) ?? fallback).split(",").map((s) => s.trim()).filter(Boolean);
  const players = list("players", "ana,ben,cy");
  const headsets = list("vr", "");
  const DEVICES = { ipad: { w: 1180, h: 820 }, iphone: { w: 393, h: 852 }, headset: { w: 1280, h: 820 } };
  const title = (name) => name.slice(0, 1).toUpperCase() + name.slice(1);

  document.getElementById("mode").textContent = params.get("manual") ? "Manual: tap any screen" : "Bots playing";

  function addDevice(name, kind, path, label) {
    const { w, h } = DEVICES[kind];
    const el = document.createElement("div");
    el.className = "device";
    el.id = "device-" + name;
    el.innerHTML = `<div class="label"><b>${label}</b><i></i></div><div class="bezel"><iframe name="${name}" width="${w}" height="${h}"></iframe></div>`;
    el.querySelector("iframe").src = `${dev}${path}?guest=${encodeURIComponent(name)}`;
    document.getElementById(kind === "iphone" ? "row-phones" : "row-big").append(el);
  }

  for (const p of headsets) addDevice(p, "headset", "/", `${title(p)} · Headset (3D room)`);
  addDevice("table", "ipad", "/host", "Table · iPad");
  for (const p of players) addDevice(p, "iphone", "/", `${title(p)} · iPhone`);

  // Fit every device on screen, whatever the window size.
  function fit() {
    const stage = document.getElementById("stage");
    const devices = document.getElementById("devices");
    devices.style.transform = "none";
    const scale = Math.min(stage.clientWidth / devices.scrollWidth, stage.clientHeight / devices.scrollHeight, 1);
    devices.style.transform = `scale(${scale})`;
  }
  addEventListener("resize", fit);
  fit();

  // The bot driver (tests/sim/run.cjs) talks to the page through these.
  window.sim = {
    log(who, text, kind = "") {
      const li = document.createElement("li");
      li.className = who === "table" ? "table" : kind;
      const t = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      li.innerHTML = `<time>${t}</time><b></b>`;
      li.querySelector("b").textContent = who === "table" ? "Table" : title(who);
      li.append(text);
      const log = document.getElementById("log");
      log.append(li);
      log.scrollTop = log.scrollHeight;
    },
    status(text) { document.getElementById("status").textContent = text; },
    tag(name, text) { const i = document.querySelector(`#device-${name} .label i`); if (i) i.textContent = text; },
    focus(name) {
      document.querySelectorAll(".device").forEach((d) => d.classList.toggle("active", d.id === "device-" + name));
    },
    go(name, path) { document.querySelector(`iframe[name="${name}"]`).src = `${dev}${path}?guest=${encodeURIComponent(name)}`; },
  };
</script>
</body>
</html>
